<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
{% seo %}
{% feed_meta %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  {% include header.html %}
  <main id="main-content" tabindex="-1" class="site-main{% if page.layout == 'home' %} home-main{% endif %}">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include contact-modal.html %}
  <script src="{{ '/assets/js/contact-modal.js' | relative_url }}" defer></script>
</body>
</html>
