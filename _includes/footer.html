<footer class="site-footer">
  <div class="footer-status">
    <span class="live-dot" aria-hidden="true"></span>
    <span>status: monitoring live telemetry</span>
  </div>
  <div class="footer-links">
    {% if site.github_username %}
    <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" aria-label="GitHub">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38l-.01-1.49c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.72-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.71 1.23 1.87.87 2.33.67.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.08-1.87 3.76-3.66 3.96.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path></svg>
      <span>github</span>
    </a>
    {% endif %}
    {% if site.linkedin_username %}
    <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.6 5.4H.6V16h3V5.4ZM2.1 4.1a1.75 1.75 0 1 0 0-3.5 1.75 1.75 0 0 0 0 3.5ZM16 9.9c0-3.2-1.7-4.7-4-4.7-1.8 0-2.6 1-3.1 1.7V5.4H5.9c.04.9 0 10.6 0 10.6h3V10c0-.3 0-.6.1-.8.2-.6.8-1.3 1.8-1.3 1.3 0 1.8 1 1.8 2.4V16h3V9.9Z"></path></svg>
      <span>linkedin</span>
    </a>
    {% endif %}
    <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 10.5a3.5 3.5 0 0 1 3.5 3.5H2v-3.5ZM2 6.5A7.5 7.5 0 0 1 9.5 14H7a5 5 0 0 0-5-5V6.5ZM2 2.5A11.5 11.5 0 0 1 13.5 14H11A9 9 0 0 0 2 5V2.5Z"></path></svg>
      <span>rss</span>
    </a>
  </div>
  <span class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author }}</span>
</footer>
