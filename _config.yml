title: Emmanuel Zúñiga
short_title: Emmanuel Zúñiga
description: >-
  Cybersecurity analyst focused on detection engineering and threat hunting
  across endpoint, network, and cloud telemetry. Tools, writeups, and CVE
  analysis.
author: Emmanuel Zúñiga
url: "https://emmazch22.github.io"
baseurl: ""
logo: /assets/images/apple-touch-icon.png
image: /assets/images/apple-touch-icon.png

github_username: Emmazch22
linkedin_username: emmazch

terminal_user: emmazch
terminal_host: soc
terminal_shell: bash

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /writeups/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
